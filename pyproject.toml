[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-agent"
version = "0.1.0"
description = "Agentic podcast post-production pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",

    # Task queue
    "celery[redis]>=5.4",
    "redis>=5.0",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",

    # AI
    "anthropic>=0.39",
    "faster-whisper>=1.0",

    # Media
    "ffmpeg-python>=0.2",
    "pydub>=0.25",
    "Pillow>=10.4",

    # Cloud / storage
    "boto3>=1.35",
    "dropbox>=12.0",
    "google-api-python-client>=2.149",
    "google-auth-oauthlib>=1.2",

    # Social platforms
    "tweepy>=4.14",

    # Utilities
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.14",
    "cryptography>=43.0",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
